name: Publish to PyPI

# Publishes the committed code (no regeneration) when a version tag is pushed, e.g.:
#   git tag v3.1.0 && git push origin v3.1.0
# Uses PyPI Trusted Publishing (OIDC): no API token. One-time setup on pypi.org:
#   project schooldigger > Settings > Publishing > add a GitHub publisher with
#   owner SchoolDigger, repository schooldigger-python, workflow publish.yml, environment pypi.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version $v"; exit 1
          fi

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
